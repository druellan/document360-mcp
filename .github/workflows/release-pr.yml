name: Release PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    # Skip when the push comes from the bot (squash/rebase merge of a release PR)
    # or when it is the merge commit of a release branch (merge-commit strategy).
    if: >-
      github.event.head_commit.author.username != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10

      - name: Bump patch version
        run: uvx bump-my-version bump patch

      - name: Update lockfile
        run: uv lock --no-upgrade

      - name: Read new version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Release v${{ steps.version.outputs.version }}"
          branch: release/v${{ steps.version.outputs.version }}
          title: "Release v${{ steps.version.outputs.version }}"
          body: |
            Automated patch release bump to v${{ steps.version.outputs.version }}.

            Merging this pull request creates a GitHub release titled `v${{ steps.version.outputs.version }}`
            whose body lists the changes since the last release.
          labels: release, automated
          delete-branch: true
