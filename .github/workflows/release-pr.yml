name: Release PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    # Skip when the pushed commit is our own release commit (squash merge keeps the
    # "Release v" message) or the merge commit of a release branch (merge-commit strategy).
    # Message-based so it works regardless of who authored the commit.
    if: >-
      !startsWith(github.event.head_commit.message, 'Release v') &&
      !contains(github.event.head_commit.message, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and bump-my-version
        run: python -m pip install --upgrade pip uv bump-my-version

      - name: Bump patch version
        run: bump-my-version bump patch

      - name: Update lockfile
        run: uv lock --no-upgrade

      - name: Read new version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          author: "Darío Ruellan <dario.ruellan@gmail.com>"
          committer: "Darío Ruellan <dario.ruellan@gmail.com>"
          commit-message: "Release v${{ steps.version.outputs.version }}"
          branch: release/v${{ steps.version.outputs.version }}
          title: "Release v${{ steps.version.outputs.version }}"
          body: |
            Automated patch release bump to v${{ steps.version.outputs.version }}.

            Merging this pull request creates a GitHub release titled `v${{ steps.version.outputs.version }}`
            whose body lists the changes since the last release.
          labels: release, automated
          delete-branch: true
